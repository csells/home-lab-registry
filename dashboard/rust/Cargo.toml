[package]
name = "lab-dashboard"
default-run = "lab-dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lab-registry = { path = "../../registry/rust" }
clap = { version = "4", features = ["derive"] }
ipnet = "2"
url = "2"
tempfile = "3"
wait-timeout = "0.2"
plist = "1"
yaml-rust2 = "0.11"
roxmltree = "0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }
curl = { version = "0.4", features = ["static-curl"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
async-stream = "0.3"
aes = "0.8"
cbc = "0.1"
ring = "0.17"
base64 = "0.22"
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
