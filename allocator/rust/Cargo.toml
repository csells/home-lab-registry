[package]
name = "lab-allocator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
base64 = "0.22"
ring = "0.17"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
