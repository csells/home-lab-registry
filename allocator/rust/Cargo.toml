[package]
name = "lab-allocator"
default-run = "lab-allocator"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["server"]
server = ["reqwest/native-tls"]

[dependencies]
lab-http-transport = { path = "../../crates/http-transport" }
lab-workspace = { path = "workspace" }
clap = { version = "4", features = ["derive"] }

tar = "0.4"
flate2 = "1"
libc = "0.2"
libloading = "0.9"
http-body-util = "0.1"
shlex = "2"
ipnet = { version = "2", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }

wait-timeout = "0.2"

reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }

rusqlite = { version = "0.43", features = ["backup", "bundled"] }
base64 = "0.22"
ring = "0.17"
subtle = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
form_urlencoded = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
