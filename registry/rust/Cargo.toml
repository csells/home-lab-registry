[package]
name = "lab-registry"
default-run = "lab-registry"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lab-http-transport = { path = "../../crates/http-transport" }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }

async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
form_urlencoded = "1"
futures-util = "0.3"
ipnet = { version = "2", features = ["serde"] }
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"

tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_SystemServices"] }
