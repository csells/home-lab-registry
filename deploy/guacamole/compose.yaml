services:
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: unless-stopped
    volumes: ['./ssh_known_hosts:/etc/guacamole/ssh_known_hosts:ro']
    entrypoint: ['/bin/sh', '-c', 'test -s /etc/guacamole/ssh_known_hosts && exec /opt/guacamole/entrypoint.sh']
    mem_limit: 192m
    cpus: 1
    networks: [terminal]
  web:
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1
    ports: ['127.0.0.1:8095:8080']
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: 'true'
      JSON_SECRET_KEY: ${JSON_SECRET_KEY}
      JAVA_OPTS: '-Xms64m -Xmx256m'
      API_SESSION_TIMEOUT: '60'
    networks: [terminal]
networks:
  terminal:
