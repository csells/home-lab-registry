map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8088;
 server_name _;
 auth_basic "Home lab";
 auth_basic_user_file /etc/nginx/lab-preview.htpasswd;
 add_header Cache-Control "no-store, private" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 access_log off;
 location = /health/guacamole {
  auth_basic off;
  proxy_pass http://127.0.0.1:8095/guacamole/api/languages;
 }
 location /guacamole/ {
  if ($http_sec_fetch_site = cross-site) { return 403; }
  if ($http_origin ~* "^https?://(?!lab\.example\.test$)") { return 403; }
  proxy_pass http://127.0.0.1:8095/guacamole/;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3700s;
  proxy_buffering off;
 }
 location / { proxy_pass http://127.0.0.1:8089; proxy_set_header Host $http_host; }
}
