name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix dashboard/frontend
      - run: npm run typecheck --prefix dashboard/frontend
      - run: npm test --prefix dashboard/frontend
      - run: npm run build --prefix dashboard/frontend
      - run: dashboard/frontend/node_modules/.bin/tsc --ignoreConfig --strict --noEmit --target es2022 --lib DOM,ES2022 --module esnext backup/review/checks.ts
  rust-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [registry, dashboard, allocator, backup]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - run: cargo +1.98.0 fmt --all --manifest-path "$CRATE/rust/Cargo.toml" --check
      - run: cargo +1.98.0 test --locked --manifest-path "$CRATE/rust/Cargo.toml"
      - if: matrix.crate == 'registry'
        run: cargo +1.98.0 test --locked --manifest-path crates/http-transport/Cargo.toml
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: agent/go.sum
      - run: cd agent && go test -race ./...
      - run: cd agent && GOOS=darwin GOARCH=arm64 go build ./...
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: dashboard/frontend
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo +1.98.0 build --locked --manifest-path dashboard/rust/Cargo.toml --example browser_fixture
      - run: npm run test:browser
        working-directory: dashboard/frontend
        env:
          LAB_GPU_SCREENSHOTS: ${{ runner.temp }}/lab-gpu-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-review
          path: ${{ runner.temp }}/lab-gpu-review/*.png
