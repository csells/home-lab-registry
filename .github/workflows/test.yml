name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s registry -v
      - run: python -m unittest discover -s dashboard -v
      - run: node --check dashboard/app.js
