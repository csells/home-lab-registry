[package]
name = "lab-backup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lab-registry = {path = "../../registry/rust"}
lab-workspace = {path = "../../allocator/rust/workspace"}
clap = {version = "4", features = ["derive"]}
flate2 = "1"
ipnet = "2"
libc = "0.2"
serde_json = "1"
tar = "0.4"
tempfile = "3"
wait-timeout = "0.2"
time = {version = "0.3", features = ["formatting"]}
axum = {version = "0.8", default-features = false, features = ["http1", "json", "tokio"]}
tokio = {version = "1", features = ["macros", "net", "rt-multi-thread", "process", "time", "fs", "sync"]}
